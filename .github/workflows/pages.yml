# reports/report.html is a self-contained page already — give it a URL instead of asking
# people to clone the repo to read the results.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'reports/report.html'
      - 'LEADERBOARD.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp reports/report.html _site/index.html
          cp LEADERBOARD.md _site/LEADERBOARD.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
